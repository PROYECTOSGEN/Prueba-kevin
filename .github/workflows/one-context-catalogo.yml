name: one-context-catalogo

# El catalogo se escribe SOLO. Antes habia que acordarse de registrar cada skill
# a mano en el indice, y lo que nadie registra es como si no existiera.
on:
  push:
    paths:
      - 'skills/**'
      - 'agentes/**'
      - '.github/one-context/catalogo.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: catalogo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  catalogo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Regenerar el indice desde lo que hay en el repo
        env:
          AREA: ${{ github.event.repository.name }}
        run: python .github/one-context/catalogo.py
      - name: Subirlo solo si cambio
        run: |
          if [ -n "$(git status --porcelain skills/_index.md)" ]; then
            git config user.name  "one-context"
            git config user.email "one-context@users.noreply.github.com"
            git add skills/_index.md
            git commit -m "catalogo: regenerado automaticamente"
            git push
          else
            echo "el indice ya estaba al dia"
          fi
